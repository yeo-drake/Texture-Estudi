name: texture_studio
description: Editor de paquetes de texturas para Minecraft Bedrock
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.4.10
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Crear proyecto Flutter base
        run: flutter create --org com.texturestudio --project-name texture_studio app

      - name: Copiar nuestro código al proyecto
        run: |
          rm -rf app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml

      - name: Instalar dependencias
        run: cd app && flutter pub get

      - name: Compilar APK
        run: cd app && flutter build apk --release

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: texture-studio-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk